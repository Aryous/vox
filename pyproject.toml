[project]
name = "vox-tts"
version = "0.1.0"
description = "One interface for every TTS model: local (Qwen3-TTS, Kokoro via MLX) and cloud providers, with a CLI, an OpenAI-compatible API and a web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aryous" }]
requires-python = ">=3.10"
keywords = ["tts", "text-to-speech", "mlx", "qwen3-tts", "kokoro", "openai-compatible", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "mlx-audio",
  "kokoro>=0.8.2",
  "misaki[zh]>=0.8.2",
  "soundfile",
  "numpy",
  # misaki 英文分词依赖；不预装的话首次运行会尝试自动安装，在非项目目录下会失败
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.urls]
Homepage = "https://github.com/Aryous/vox"
Issues = "https://github.com/Aryous/vox/issues"

[project.scripts]
vox = "vox.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vox", "vox.providers"]

[tool.setuptools.package-data]
vox = ["registry.json", "web/*", "web/icons/*"]
